name: Verify FinovaIQ
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: finovaiq
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: finovaiq
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U finovaiq" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://finovaiq:local-development-only@localhost:5432/finovaiq?schema=public
      WEB_ORIGIN: http://localhost:3001
      AI_MODE: demo
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @finovaiq/api test
        env:
          RUN_INTEGRATION: "1"
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit --prod --audit-level high
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 3
  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.lock.txt
      - run: pytest -q
